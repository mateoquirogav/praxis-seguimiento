*{margin:0;padding:0;box-sizing:border-box}

b{display:block;font-size:.82rem;letter-spacing:3px;text-transform:uppercase}

<div>
  <div class="lg"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M16 7h5v5"/></svg></div>
